<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Ciudad Gris — Agenda cultural de Lima. Conciertos, ferias, exposiciones, gastronomía y teatro.">
<title>Ciudad Gris — Agenda cultural de Lima</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1eb;
    --bg-warm: #eae5dc;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #5a5650;
    --ink-muted: #9a9590;
    --accent: #c43e2a;
    --music: #c43e2a;
    --arte: #2a6bc4;
    --feria: #c4892a;
    --gastro: #2aaa6c;
    --teatro: #8a3ec4;
    --border: rgba(26, 26, 26, 0.08);
    --border-strong: rgba(26, 26, 26, 0.15);
    --radius: 14px;
    --shadow: 0 2px 12px rgba(26, 26, 26, 0.06);
    --shadow-hover: 0 8px 32px rgba(26, 26, 26, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; min-height: 100dvh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 9999;
    pointer-events: none; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  /* HEADER */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(244, 241, 235, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-family: 'Instrument Serif', serif; font-size: 28px; letter-spacing: -0.5px; }
  .brand-tagline {
    font-size: 11px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 2px; color: var(--ink-muted); display: none;
  }
  @media (min-width: 480px) { .brand-tagline { display: block; } }
  .header-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--ink-muted); letter-spacing: 0.3px;
  }

  /* TOOLBAR */
  .toolbar { max-width: 900px; margin: 0 auto; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .filter-row, .date-row {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filter-row::-webkit-scrollbar, .date-row::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0; padding: 7px 14px; border-radius: 100px;
    border: 1px solid var(--border-strong); background: transparent;
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--ink-soft); cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--ink); color: var(--ink); }
  .filter-chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle; position: relative; top: -1px;
  }

  .date-chip {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border-strong);
    background: transparent; cursor: pointer; transition: all 0.2s; min-width: 52px;
  }
  .date-chip:hover { border-color: var(--ink); }
  .date-chip.active { background: var(--ink); border-color: var(--ink); }
  .date-chip .d-weekday {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--ink-muted); transition: color 0.2s;
  }
  .date-chip .d-number { font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1; transition: color 0.2s; }
  .date-chip.active .d-weekday, .date-chip.active .d-number { color: var(--bg); }
  .date-chip.has-events::after {
    content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent); margin-top: 2px; transition: background 0.2s;
  }
  .date-chip.active.has-events::after { background: var(--bg); }

  /* MAIN */
  .main-content { max-width: 900px; margin: 0 auto; padding: 8px 20px 60px; }
  .time-section { margin-top: 28px; }
  .time-label {
    font-family: 'Instrument Serif', serif; font-size: 20px; font-style: italic;
    color: var(--ink-soft); margin-bottom: 14px; padding-left: 2px;
  }
  .time-label .count {
    font-family: 'JetBrains Mono', monospace; font-style: normal;
    font-size: 12px; color: var(--ink-muted); margin-left: 8px;
  }

  /* CARDS */
  .events-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 600px) {
    .events-grid { grid-template-columns: 1fr 1fr; }
    .events-grid .event-card.featured { grid-column: 1 / -1; }
  }
  .event-card {
    background: var(--surface); border-radius: var(--radius); overflow: hidden;
    cursor: pointer; box-shadow: var(--shadow); position: relative;
    transition: transform 0.25s cubic-bezier(0.22,1,0.36,1), box-shadow 0.25s;
    opacity: 0; transform: translateY(20px);
    animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .event-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .card-img-wrap { width: 100%; height: 200px; overflow: hidden; position: relative; background: #e8e4dd; }
  .event-card.featured .card-img-wrap { height: 280px; }
  .card-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .event-card:hover .card-img { transform: scale(1.04); }
  .card-img-placeholder {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  }

  .card-date-badge {
    position: absolute; top: 14px; left: 14px; z-index: 2;
    background: var(--surface); border-radius: 10px; padding: 6px 10px;
    text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); line-height: 1;
  }
  .card-date-badge .day { font-weight: 700; font-size: 20px; display: block; }
  .card-date-badge .month {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--ink-muted); margin-top: 1px; display: block;
  }
  .card-type-tag {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    padding: 4px 10px; border-radius: 100px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px; color: white;
  }
  .card-type-tag.musica { background: var(--music); }
  .card-type-tag.arte { background: var(--arte); }
  .card-type-tag.feria { background: var(--feria); }
  .card-type-tag.gastro { background: var(--gastro); }
  .card-type-tag.teatro { background: var(--teatro); }

  .card-price-badge {
    position: absolute; bottom: 14px; right: 14px; z-index: 2;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    padding: 5px 12px; border-radius: 100px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: white;
  }
  .card-price-badge.free { background: var(--gastro); }

  .card-info { padding: 16px 18px 18px; }
  .card-name { font-family: 'Instrument Serif', serif; font-size: 19px; line-height: 1.25; margin-bottom: 8px; }
  .event-card.featured .card-name { font-size: 24px; }
  .card-details { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-soft); }
  .card-detail { display: flex; align-items: center; gap: 5px; }
  .card-detail svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.5; }

  /* DETAIL OVERLAY */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(26,26,26,0.4); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .detail-overlay.open { opacity: 1; pointer-events: all; }
  .detail-panel {
    position: fixed; right: 0; top: 0; bottom: 0;
    width: 100%; max-width: 520px; background: var(--bg);
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
    overflow-y: auto; box-shadow: -8px 0 40px rgba(0,0,0,0.1);
  }
  .detail-overlay.open .detail-panel { transform: translateX(0); }
  .detail-close {
    position: sticky; top: 0; z-index: 10; display: flex; justify-content: flex-end;
    padding: 16px 20px; background: linear-gradient(to bottom, var(--bg) 60%, transparent);
  }
  .detail-close button {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--ink); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-hero-wrap { width: 100%; height: 260px; overflow: hidden; margin-top: -56px; background: #e8e4dd; }
  .detail-hero-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-body { padding: 24px 24px 48px; }
  .detail-type-tag {
    display: inline-block; padding: 4px 12px; border-radius: 100px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: white; margin-bottom: 14px;
  }
  .detail-title {
    font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1.15; margin-bottom: 20px;
  }
  .detail-meta {
    display: flex; flex-direction: column; gap: 10px;
    padding: 18px 0; margin-bottom: 20px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .detail-meta-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); }
  .detail-meta-row svg { width: 18px; height: 18px; opacity: 0.45; flex-shrink: 0; }
  .detail-meta-row strong { color: var(--ink); font-weight: 600; }
  .detail-description { font-size: 15px; line-height: 1.75; color: var(--ink-soft); margin-bottom: 28px; }
  .detail-description p { margin-bottom: 14px; }
  .detail-cta {
    display: block; width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: var(--ink); color: var(--bg); font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 600; text-align: center; text-decoration: none;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  .detail-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(26,26,26,0.2); }
  .detail-cta-secondary {
    display: block; width: 100%; padding: 14px; margin-top: 10px;
    border: 1px solid var(--border-strong); border-radius: 12px;
    background: transparent; color: var(--ink); font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 500; text-align: center; cursor: pointer;
  }

  /* LOADING & EMPTY */
  .loading-state {
    text-align: center; padding: 80px 20px; display: none;
  }
  .loading-state.visible { display: block; }
  .loading-state .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p { font-size: 14px; color: var(--ink-muted); }

  .no-results { text-align: center; padding: 60px 20px; display: none; }
  .no-results.visible { display: block; }
  .no-results h3 {
    font-family: 'Instrument Serif', serif; font-size: 22px;
    font-style: italic; margin-bottom: 8px; color: var(--ink-soft);
  }
  .no-results p { font-size: 14px; color: var(--ink-muted); }

  .error-state {
    text-align: center; padding: 60px 20px; display: none;
  }
  .error-state.visible { display: block; }
  .error-state h3 { font-family: 'Instrument Serif', serif; font-size: 22px; margin-bottom: 8px; color: var(--accent); }
  .error-state p { font-size: 14px; color: var(--ink-muted); line-height: 1.6; max-width: 400px; margin: 0 auto; }

  /* FOOTER */
  .site-footer {
    max-width: 900px; margin: 0 auto; padding: 32px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
  }
  .footer-brand { font-family: 'Instrument Serif', serif; font-size: 16px; color: var(--ink-muted); }
  .footer-links { display: flex; gap: 20px; font-size: 12px; }
  .footer-links a { color: var(--ink-muted); text-decoration: none; }
  .footer-links a:hover { color: var(--ink); }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-name">Ciudad Gris</div>
      <div class="brand-tagline">Agenda cultural</div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>
</header>

<div class="toolbar">
  <div class="filter-row" id="filterBar">
    <button class="filter-chip active" data-filter="all">Todo</button>
    <button class="filter-chip" data-filter="musica"><span class="chip-dot" style="background:var(--music)"></span>Música</button>
    <button class="filter-chip" data-filter="arte"><span class="chip-dot" style="background:var(--arte)"></span>Arte</button>
    <button class="filter-chip" data-filter="feria"><span class="chip-dot" style="background:var(--feria)"></span>Ferias</button>
    <button class="filter-chip" data-filter="gastro"><span class="chip-dot" style="background:var(--gastro)"></span>Gastronomía</button>
    <button class="filter-chip" data-filter="teatro"><span class="chip-dot" style="background:var(--teatro)"></span>Teatro</button>
  </div>
  <div class="date-row" id="dateRow"></div>
</div>

<main class="main-content" id="mainContent"></main>

<div class="loading-state" id="loadingState">
  <div class="spinner"></div>
  <p>Cargando eventos...</p>
</div>

<div class="no-results" id="noResults">
  <h3>Nada por acá... todavía</h3>
  <p>No hay eventos con estos filtros. Prueba otra categoría o fecha.</p>
</div>

<div class="error-state" id="errorState">
  <h3>No se pudieron cargar los eventos</h3>
  <p id="errorMsg"></p>
</div>

<footer class="site-footer">
  <div class="footer-brand">Ciudad Gris © 2026</div>
  <div class="footer-links">
    <a href="#">Instagram</a>
    <a href="#">Newsletter</a>
    <a href="#">Contacto</a>
  </div>
</footer>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel">
    <div class="detail-close"><button onclick="closeDetail()">✕</button></div>
    <div class="detail-hero-wrap" id="detailHeroWrap"></div>
    <div class="detail-body">
      <div class="detail-type-tag" id="detailTag"></div>
      <h1 class="detail-title" id="detailTitle"></h1>
      <div class="detail-meta">
        <div class="detail-meta-row">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="detailDate"></span>
        </div>
        <div class="detail-meta-row">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span id="detailTime"></span>
        </div>
        <div class="detail-meta-row">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span><strong id="detailPlace"></strong> · <span id="detailDistrict"></span></span>
        </div>
        <div class="detail-meta-row">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M2 8.5h20M6 12h2m4 0h6M6 15.5h4"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
          <span id="detailPrice"></span>
        </div>
      </div>
      <div class="detail-description" id="detailDesc"></div>
      <a class="detail-cta" id="detailCta" href="#" target="_blank">Más información</a>
      <button class="detail-cta-secondary" onclick="shareEvent()">Compartir evento</button>
    </div>
  </div>
</div>

<!-- CONFIG: Edit config.js with your Airtable credentials -->
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
